name: Temporary matched-reinvestment benchmark
on:
  push:
    branches: [feat/compounding-expansion-experiment]

permissions:
  contents: write

jobs:
  compound-and-expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Format and verify tests
        run: |
          npm run format
          npm run check
      - name: Compare paired 300-round economics
        run: |
          set -euo pipefail
          mkdir -p reports
          for scenario in duel-default duel-aggressive field-default; do
            case "$scenario" in
              duel-default) nodes=20; players=2; rival=default; seed=invest-vs-expand-duel ;;
              duel-aggressive) nodes=20; players=2; rival=aggressive; seed=invest-vs-expand-agg ;;
              field-default) nodes=40; players=4; rival=default; seed=invest-vs-expand-field ;;
            esac
            for strategy in superturtle compoundexpand; do
              roster="$strategy"
              for ((p=1; p<players; p++)); do roster="$roster,$rival"; done
              node scripts/simulate.mjs --matches=30 --nodes="$nodes" --players="$players" \
                --rounds=300 --seed="$seed" --strategies="$roster" \
                --attack-pct=5 --json > "reports/${scenario}-${strategy}.json"
              node scripts/summarize-simulation.mjs "reports/${scenario}-${strategy}.json" \
                > "reports/${scenario}-${strategy}.md"
            done
            node scripts/compare-economy.mjs \
              "reports/${scenario}-superturtle.json" \
              "reports/${scenario}-compoundexpand.json" \
              > "reports/${scenario}-comparison.md"
            cat "reports/${scenario}-comparison.md" >> "$GITHUB_STEP_SUMMARY"
            printf '\\n---\\n' >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matched-reinvestment-300
          path: reports/
          retention-days: 30
      - name: Commit Prettier formatting
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Format compounding expansion experiment"
            git push
          fi
