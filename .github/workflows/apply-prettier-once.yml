name: Temporary formatting run
on:
  push:
    branches: [chore/prettier-formatting]

permissions:
  contents: write

jobs:
  apply-prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Format working tree
        run: npm run format
      - name: Commit formatting and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Apply Prettier to project source and tests"
            git push
          fi
