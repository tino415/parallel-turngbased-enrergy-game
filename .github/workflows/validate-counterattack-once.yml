name: Temporary counterattack validation
on:
  push:
    branches: [feat/phase-turtle-counterattack]
permissions:
  contents: write
jobs:
  check-and-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Apply Prettier
        run: npm run format
      - name: Run engine and regression tests
        run: npm run check
      - name: Compare same-seed two-player scenarios
        run: |
          mkdir -p reports
          node scripts/simulate.mjs --matches=20 --nodes=20 --players=2 --rounds=250 \
            --strategies=turtlecounter,default --turtle-rounds=150 --attack-pct=5 \
            --seed=duel-v1 --json > reports/counterattack.json
          node scripts/simulate.mjs --matches=20 --nodes=20 --players=2 --rounds=250 \
            --strategies=superturtle,default --seed=duel-v1 --json > reports/superturtle.json
          node scripts/summarize-simulation.mjs reports/counterattack.json > reports/counterattack.md
          node scripts/summarize-simulation.mjs reports/superturtle.json > reports/superturtle.md
          cat reports/counterattack.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n' >> "$GITHUB_STEP_SUMMARY"
          cat reports/superturtle.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterattack-comparison
          path: reports/
          retention-days: 14
      - name: Commit formatting
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Format counterattack simulation changes"
            git push
          fi
