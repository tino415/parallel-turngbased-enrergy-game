name: Markdown checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  markdown-format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Markdown format
        run: npm run format:check:md
