name: Temporary AI code formatting

on:
  pull_request:
    paths:
      - '.github/workflows/format-ai-temporary.yml'

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/soft-cap-withdrawal-gameplay'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/soft-cap-withdrawal-gameplay
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Format only AI regression changes
        run: |
          npx prettier --write src/engine.js tests/economy-gameplay.test.mjs README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add src/engine.js tests/economy-gameplay.test.mjs README.md
            git commit -m 'style(ai): normalize assault-planning and regression test formatting'
            git push origin HEAD:feat/soft-cap-withdrawal-gameplay
          fi
