name: Browser UI checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Syntax and unit tests
        run: npm run check
      - name: Browser tests
        run: npm run test:ui
      - name: Upload screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
